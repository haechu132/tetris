<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NULLBLOCK</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>NULL<span>BLOCK</span></h1>
<div class="wrap">
  <div class="boardWrap">
    <canvas id="board" width="300" height="600"></canvas>
    <div id="overlay"></div>
  </div>
  <div class="side">
    <div class="box"><div class="label">다음</div><canvas id="next" width="120" height="90"></canvas></div>
    <div class="box"><div class="label">점수</div><div class="value" id="score">0</div></div>
    <div class="box"><div class="label">줄</div><div class="value" id="lines">0</div></div>
    <div class="box"><div class="label">레벨</div><div class="value" id="level">1</div></div>
    <button id="start">시작</button>
    <button id="pause" disabled>일시정지</button>
    <div class="box keys">
      <b>← →</b> 이동<br>
      <b>↑ / X</b> 회전<br>
      <b>Z</b> 반대 회전<br>
      <b>↓</b> 천천히 내리기<br>
      <b>Space</b> 바로 떨어뜨리기<br>
      <b>P / Esc</b> 일시정지
    </div>
  </div>
</div>

<script src="game.js"></script>
<script src="features/sound.js"></script>
<!-- 기능 파일은 game.js 아래에 한 줄씩 추가하세요. 예:
<script src="features/sound.js"></script>
-->
</body>
</html>
